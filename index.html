<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03a9f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zeiterfassung">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>Zeiterfassung</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" data-action="toggle-nav" aria-label="Menü ein-/ausklappen" title="Menü ein-/ausklappen"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="brand"><span class="logo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg></span><span>Zeiterfassung</span></div>
    <div class="topbar-right">
      <a href="#/tracker" id="top-timer" class="top-timer" hidden><span>0:00:00</span></a>
      <button id="sync-status" class="sync-status" data-action="cloud-status" hidden></button>
      <button id="user-btn" class="user-btn" data-action="user-menu" aria-label="Benutzermenü"><span class="avatar" id="user-avatar"></span><span id="user-name" class="user-name"></span></button>
    </div>
  </header>
  <nav class="sidebar" id="sidebar"></nav>
  <div class="nav-scrim" data-action="toggle-nav"></div>
  <main id="view"></main>
  <nav class="bottombar" id="bottombar"></nav>
</div>
<div id="modal-root"></div>
<div id="popover-root"></div>
<div id="toast" role="status"></div>
<input type="file" id="import-file" accept="application/json,.json" data-change="import" hidden>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js" integrity="sha384-YnOjsoOxSYo65h1BXWnSq24bFbqW8HfzMWSEQxYEMRmjW9Vl1J3HZI3iZxqNYvIi" crossorigin="anonymous" defer></script>
<script src="config.js" defer></script>
<script src="app.js" defer></script>
<script src="cloud.js" defer></script>
</body>
</html>
